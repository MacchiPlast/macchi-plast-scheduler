name: Update Planning
on:
  push:
    paths: ['data/*.csv']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Rigenera dati JS da CSV
        run: |
          python scheduler.py
      - name: Commit e Push dei dati aggiornati
        run: |
          git config user.name 'Automazione Bot'
          git config user.email 'bot@macchiplast.com'
          git add docs/pianificazione.js
          git commit -m "Auto-aggiornamento dati pianificazione" || exit 0
          git push
