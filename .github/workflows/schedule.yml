name: Update Planning
on:
  push:
    paths: ['data/*.csv']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Esegui Scheduler
        run: python scheduler.py
      - name: Commit e Push
        run: |
          git config user.name 'Automazione Bot'
          git config user.email 'bot@macchiplast.com'
          git add docs/index.html
          git commit -m "Aggiornamento automatico planning" || exit 0
          git push
