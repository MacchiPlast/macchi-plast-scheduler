<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Produzione - Macchi Plast</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .completed { opacity: 0.5; filter: grayscale(1); }
        .task-item { margin-top: 10px; display: block; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Programmazione Presse</h1>
    <div id="dashboard" class="grid">Caricamento in corso...</div>

    <!-- Carica i dati generati dal bot -->
    <script src="dati.js"></script>

    <script>
        function caricaDashboard() {
            const container = document.getElementById('dashboard');
            
            // Verifica che i dati siano stati caricati dal file dati.js
            if (typeof APP_DATA === 'undefined') {
                container.innerHTML = "<p>Errore: Impossibile caricare i dati. Verifica il file dati.js</p>";
                return;
            }

            container.innerHTML = ""; 

            // Ciclo sugli ordini
            APP_DATA.ordini.forEach(ordine => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = 'card-' + ordine.id;
                
                const isChecked = localStorage.getItem('status_' + ordine.id) === 'true';
                if (isChecked) card.classList.add('completed');

                card.innerHTML = `
                    <h3>Ordine: ${ordine.id}</h3>
                    <p>Articolo: ${ordine.articolo}</p>
                    <p>Quantità: ${ordine.qta}</p>
                    <label class="task-item">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} 
                               onchange="toggleStato('${ordine.id}', this.checked)">
                        Conferma chiusura turno
                    </label>
                `;
                container.appendChild(card);
            });
        }

        function toggleStato(id, stato) {
            localStorage.setItem('status_' + id, stato);
            const card = document.getElementById('card-' + id);
            card.classList.toggle('completed', stato);
        }

        // Attendiamo che lo script esterno sia pronto
        window.onload = caricaDashboard;
    </script>
</body>
</html>
