<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Produzione - Macchi Plast</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .task-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-right: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Programmazione Presse</h1>
    
    <!-- Contenitore principale dove appariranno i dati -->
    <div id="dashboard" class="grid">
        <p>Caricamento dati in corso...</p>
    </div>

    <!-- Questo commento è FONDAMENTALE per il file Python -->
    <!-- DATA_READY -->

    <script>
        // Questa funzione viene chiamata dopo che il file Python inietta APP_DATA
        function caricaDashboard() {
            const container = document.getElementById('dashboard');
            
            if (typeof APP_DATA === 'undefined') {
                container.innerHTML = "<p>Errore: Dati non caricati. Verifica il file scheduler.py</p>";
                return;
            }

            container.innerHTML = ""; // Pulisce il messaggio di caricamento

            // Esempio: Mostriamo gli ordini caricati
            APP_DATA.ordini.forEach(ordine => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>Ordine: ${ordine.id}</h3>
                    <p>Articolo: ${ordine.articolo}</p>
                    <p>Quantità: ${ordine.qta}</p>
                    <label class="task-item">
                        <input type="checkbox" onchange="salvaStato('${ordine.id}', this.checked)">
                        Segna come completato
                    </label>
                `;
                container.appendChild(card);
            });
        }

        // Funzione per salvare le spunte su tablet
        function salvaStato(id, stato) {
            localStorage.setItem('stato_' + id, stato);
            console.log("Stato salvato per " + id + ": " + stato);
        }

        // Avvio
        window.onload = caricaDashboard;
    </script>
</body>
</html>
